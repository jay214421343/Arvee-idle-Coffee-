name: ARVEE Idle CI
on:
  push:
    branches: [master, feature/arvee-idle-rebrand-infra]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arvee_idle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arvee_idle_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/arvee_idle_test
      ARVEE_IDLE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/arvee_idle_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run db:migrate
      - run: npm test
